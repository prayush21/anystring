[project]
name = "racketguitar"
version = "0.1.0"
description = "Turn a tennis racket into a playable guitar with a MacBook camera and mic."
readme = "docs/PID.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    # mediapipe pulls in opencv-contrib-python, which ships cv2.aruco. Do not also add
    # opencv-python: both install the same cv2 module and clobber each other.
    "mediapipe>=0.10.14",
    "opencv-contrib-python>=4.10",
    "sounddevice>=0.5",
    "pillow>=10.0",
    "tomli-w>=1.0",
    "certifi>=2024.2",
]

[project.optional-dependencies]
fluid = ["pyfluidsynth>=1.3"]

[project.scripts]
racketguitar = "racketguitar.app:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["racketguitar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not hardware'"
markers = [
    "hardware: needs a real camera, mic or speakers (deselected by default)",
    "slow: takes more than a second or two",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
